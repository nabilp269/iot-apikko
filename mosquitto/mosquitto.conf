# Konfigurasi pengembangan untuk dashboard ESP32 + Flutter Web.
# Jangan gunakan allow_anonymous di lingkungan publik/produksi.
allow_anonymous true

# ESP32 PubSubClient menggunakan MQTT TCP biasa.
listener 1883
protocol mqtt

# Flutter Web/Chrome wajib menggunakan MQTT melalui WebSocket.
listener 9001
protocol websockets

log_dest stdout
log_type all
